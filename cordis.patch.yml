# dsh-subagent-role-router bundle patch: one host plugin row that registers
# the `dsh-subagent-role-router` settings section and wraps the host subagents
# service, so every delegation without an explicit `agentOptions` (the stock
# `subagent` / `subagent_fork` tools and any other tool that omits model or
# provider) runs the child on the configured route.
- insert:
    - id: dsh-subagent-role-router
      name: 'dsh-subagent-role-router'
